[project]
name = "gonggong-disaster-series-rescue79"
version = "0.2.0"
description = "Local human-reviewed static D7/D9 generated-still model reviewer"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "obundh" }]
classifiers = [
  "Private :: Do Not Upload",
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.141,<1",
  "numpy>=2.5,<3",
  "opencv-python-headless>=5,<6",
  "pillow>=12.3,<13",
  "python-multipart>=0.0.22,<1",
  "torch==2.13.0",
  "torchvision==0.28.0",
  "uvicorn>=0.35,<1",
]

[project.scripts]
rescue79-reviewer = "rescue79.cli:main"

[dependency-groups]
dev = [
  "httpx2>=2,<3",
  "pytest>=9.1,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rescue79"]

[tool.hatch.build.targets.sdist]
exclude = ["*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
markers = [
  "integration: loads the 237 MB COCO pose detector and evaluates public images",
]
